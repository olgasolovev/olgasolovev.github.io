  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <nav>
      <a class="brand" href="index.html#top">Olga Soloveva</a>
      <div class="nav-links">
        <a href="index.html#research">Research</a>

  <main style="padding-top: 3rem;">
    <!-- Interactive Quiz Container -->
    <div class="quiz-container" style="max-width: 800px; margin: 0 auto;">
      <h3 class="quiz-title">Interactive Demo: The LPM Effect & Scattering</h3>
      <p style="text-align: center; color: var(--muted); margin-bottom: 2rem;">Test your knowledge of the Landau-Pomeranchuk-Migdal effect.</p>
      
      <div id="quiz"></div>
      <button id="submit-quiz">Submit Answers</button>
      <div id="quiz-results"></div>
    </div>
  </main>

  <footer style="margin-top: 4rem;">
    © <span id="year"></span> Olga Soloveva. Built with static HTML for GitHub Pages.
  </footer>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();

    // --- LPM Quiz Script ---
    const quizData = [
        {
            question: "1. What does the Landau-Pomeranchuk-Migdal (LPM) effect primarily describe in high-energy physics?",
            options: {
                a: "Increased radiation from independent scatterings",
                b: "Suppressed radiation due to quantum interference",
                c: "The rapid absorption of gluons by the nucleus",
                d: "The deceleration of particles in a vacuum"
            },
            correct: "b"
        },
        {
            question: "2. In the scattering timeline schematic, what does &tau;<sub>f</sub> represent?",
            options: {
                a: "Total flight time",
                b: "Temperature of the field",
                c: "Gluon formation time",
                d: "Time between independent collisions"
            },
            correct: "c"
        },
        {
            question: "3. What happens if the gluon formation time (&tau;<sub>f</sub>) spans across multiple scattering centers?",
            options: {
                a: "The scattering centers act coherently, leading to suppressed radiation.",
                b: "The particle stops moving entirely.",
                c: "The radiation output is exactly doubled.",
                d: "The exchanged particle breaks apart into quarks."
            },
            correct: "a"
        },
        {
            question: "4. Compared to standard independent scattering (Bethe-Heitler), the total radiation under the LPM effect is:",
            options: {
                a: "Significantly greater",
                b: "Exactly the same",
                c: "Less than the sum of independent scatterings",
                d: "Completely zero"
            },
            correct: "c"
        },
        {
            question: "5. In which city was the prominent theoretical physicist Lev Landau born?",
            options: {
                a: "Moscow",
                b: "Baku",
                c: "St. Petersburg",
                d: "Kyiv"
            },
            correct: "b"
        }
    ];

    const quizContainer = document.getElementById('quiz');
    const resultsContainer = document.getElementById('quiz-results');
    const submitButton = document.getElementById('submit-quiz');

    function buildQuiz() {
        const output = [];
        quizData.forEach((currentQuestion, questionNumber) => {
            const answers = [];
            for (letter in currentQuestion.options) {
                answers.push(
                    `<label class="option-label">
                        <input type="radio" name="question${questionNumber}" value="${letter}">
                        <strong>${letter.toUpperCase()}</strong>: ${currentQuestion.options[letter]}
                    </label>`
                );
            }
            output.push(
                `<div class="question">
                    <h4>${currentQuestion.question}</h4>
                    <div class="options">${answers.join('')}</div>
                    <div class="correct-answer" id="answer${questionNumber}" style="display:none;">
                        Correct Answer: ${currentQuestion.correct.toUpperCase()}
                    </div>
                </div>`
            );
        });
        quizContainer.innerHTML = output.join('');
    }

    function showResults() {
        const answerContainers = quizContainer.querySelectorAll('.options');
        let numCorrect = 0;

        quizData.forEach((currentQuestion, questionNumber) => {
            const answerContainer = answerContainers[questionNumber];
            const selector = `input[name=question${questionNumber}]:checked`;
            const userAnswer = (answerContainer.querySelector(selector) || {}).value;
            const correctDisplay = document.getElementById(`answer${questionNumber}`);
            
            correctDisplay.style.display = "block";

            if (userAnswer === currentQuestion.correct) {
                numCorrect++;
                correctDisplay.style.color = "#27ae60"; 
            } else {
                correctDisplay.style.color = "#e74c3c";
            }
        });

        resultsContainer.innerHTML = `You scored ${numCorrect} out of ${quizData.length}!`;
        resultsContainer.style.display = "block";
        submitButton.style.display = "none";
    }

    if(quizContainer && submitButton) {
        buildQuiz();
        submitButton.addEventListener('click', showResults);
    }
  </script>
</body>
</html>
